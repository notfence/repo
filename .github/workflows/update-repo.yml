name: Update package repository

on:
  push:
    branches:
      - main
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - package-release
      - vless-core-release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check package releases
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          current_state="$(./scripts/build-repo.sh --state)"
          deployed_state="$(curl --fail --location --silent --show-error \
            --max-time 15 https://notfence.github.io/repo/release-state 2>/dev/null || true)"

          if [[ "${EVENT_NAME}" == "schedule" && "${deployed_state}" == "${current_state}" ]]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "All package releases are already published"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Publishing updated package repository"
          fi

      - name: Install repository tools
        if: steps.release.outputs.deploy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bzip2 jq

      - name: Build package repository
        if: steps.release.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-repo.sh

      - name: Upload GitHub Pages artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy GitHub Pages
        if: steps.release.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
