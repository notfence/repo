<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>notfence's Repo</title>
  <meta name="description" content="Sileo/Cydia repository by notfence for jailbroken iOS devices.">

  <style>
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-width: 280px;
      background: #0f1115;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .wrap {
      width: 720px;
      max-width: calc(100% - 32px);
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    header { margin-bottom: 48px; }

    .brand {
      min-height: 42px;
      margin-bottom: 22px;
      line-height: 42px;
    }

    .brand img {
      float: left;
      width: 42px;
      height: 42px;
      margin-right: 12px;
      border-radius: 10px;
    }

    .brand strong {
      font-size: 18px;
      vertical-align: middle;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 52px;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 620px;
      margin: 0;
      color: #9ca3af;
      font-size: 17px;
      line-height: 1.6;
    }

    .repo {
      margin-top: 28px;
      padding: 14px;
      border: 1px solid #252932;
      border-radius: 14px;
      background: #15181e;
    }

    .repo-url {
      margin-bottom: 12px;
      color: #b7bdc8;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .button {
      display: inline-block;
      min-height: 42px;
      margin: 0 6px 6px 0;
      padding: 0 13px;
      border: 1px solid #303540;
      border-radius: 10px;
      background: #1b1f27;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 40px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    button.button {
      height: 42px;
      vertical-align: top;
    }

    .button.primary {
      border-color: #6d5dfc;
      background: #6d5dfc;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 26px;
      letter-spacing: -0.025em;
    }

    .package {
      min-height: 92px;
      margin-bottom: 10px;
      padding: 18px;
      border: 1px solid #252932;
      border-radius: 14px;
      background: #15181e;
    }

    .package:after,
    .brand:after {
      content: "";
      display: table;
      clear: both;
    }

    .package-icon {
      float: left;
      width: 56px;
      height: 56px;
      margin-right: 16px;
      border-radius: 13px;
      background: #1e222a;
    }

    .package-body {
      min-width: 0;
      overflow: hidden;
    }

    .package h3 {
      margin: 1px 0 4px;
      font-size: 18px;
      line-height: 1.2;
      word-wrap: break-word;
    }

    .package-id {
      margin-bottom: 8px;
      color: #686f7d;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .package p {
      margin: 0;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .meta {
      margin-top: 10px;
      font-size: 0;
    }

    .tag {
      display: inline-block;
      max-width: 100%;
      margin: 0 6px 6px 0;
      padding: 5px 7px;
      border-radius: 7px;
      background: #1e222a;
      color: #858d9b;
      font-size: 11px;
      line-height: 1.2;
      vertical-align: top;
      word-wrap: break-word;
    }

    .source {
      display: inline-block;
      margin-top: 6px;
      color: #aaa2ff;
      font-size: 13px;
      text-decoration: none;
      word-wrap: break-word;
    }

    .status {
      padding: 18px;
      border: 1px solid #252932;
      border-radius: 14px;
      background: #15181e;
      color: #7f8795;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      margin-top: 48px;
      padding-top: 22px;
      border-top: 1px solid #20242c;
      color: #646c79;
      font-size: 12px;
    }

    footer a {
      color: #858d9b;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .wrap {
        max-width: calc(100% - 24px);
        padding-top: 34px;
      }

      header { margin-bottom: 38px; }

      h1 { font-size: 38px; }

      .lead {
        font-size: 16px;
        line-height: 1.55;
      }

      .button {
        display: block;
        width: 100%;
        margin: 0 0 8px;
      }

      .package {
        padding: 15px;
      }

      .package-icon {
        width: 52px;
        height: 52px;
        margin-right: 13px;
        border-radius: 12px;
      }
    }

    @media (max-width: 350px) {
      .wrap {
        max-width: calc(100% - 20px);
        padding-top: 30px;
      }

      h1 { font-size: 34px; }

      .package {
        padding: 13px;
      }

      .package-icon {
        width: 46px;
        height: 46px;
        margin-right: 11px;
      }

      .package h3 { font-size: 17px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <img src="CydiaIcon.png" alt="">
        <strong>notfence's Repo</strong>
      </div>


      <p class="lead">
        A small Sileo/Cydia repository.
      </p>
      <p class="lead">
      There you can find apps/tweaks made by me.
      </p>

      <div class="repo">
        <div class="repo-url">https://notfence.github.io/repo/</div>

        <a class="button primary" href="sileo://source/https://notfence.github.io/repo/">Add to Sileo</a>
        <a class="button" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://notfence.github.io/repo/">Add to Cydia</a>
        <a class="button" href="zbra://sources/add/https://notfence.github.io/repo/">Add to Zebra</a>
        <button class="button" id="copyButton" type="button">Copy URL</button>
      </div>
    </header>

    <section>
      <h2>Packages</h2>
      <div id="packages">
        <div class="status">Loading packages…</div>
      </div>
    </section>

    <footer>
      <a href="https://github.com/notfence/repo" target="_blank" rel="noreferrer">GitHub repo source</a>
    </footer>
  </main>

  <script>
    (function () {
      var REPO_URL = "https://notfence.github.io/repo/";
      var packagesNode = document.getElementById("packages");
      var copyButton = document.getElementById("copyButton");

      function copyRepo() {
        function done() {
          var old = copyButton.innerHTML;
          copyButton.innerHTML = "Copied";
          window.setTimeout(function () {
            copyButton.innerHTML = old;
          }, 1200);
        }

        function legacyCopy() {
          var el = document.createElement("textarea");
          el.value = REPO_URL;
          el.setAttribute("readonly", "");
          el.style.position = "fixed";
          el.style.opacity = "0";
          document.body.appendChild(el);
          el.select();

          try {
            document.execCommand("copy");
            done();
          } catch (e) {}

          document.body.removeChild(el);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(REPO_URL).then(done, legacyCopy);
        } else {
          legacyCopy();
        }
      }

      copyButton.onclick = copyRepo;

      function parsePackages(text) {
        text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

        var blocks = text.split(/\n\s*\n/);
        var result = [];
        var seen = {};
        var b, i, lines, pkg, currentKey, line, colon, continuation;

        for (b = 0; b < blocks.length; b++) {
          lines = blocks[b].split("\n");
          pkg = {};
          currentKey = null;

          for (i = 0; i < lines.length; i++) {
            line = lines[i];

            if (/^[ \t]/.test(line) && currentKey) {
              continuation = line.replace(/^[ \t]/, "");
              if (continuation === ".") continuation = "";
              pkg[currentKey] += (pkg[currentKey] ? "\n" : "") + continuation;
              continue;
            }

            colon = line.indexOf(":");
            if (colon <= 0) continue;

            currentKey = line.slice(0, colon);
            pkg[currentKey] = line.slice(colon + 1).replace(/^[ \t]+/, "");
          }

          if (!pkg.Package || seen[pkg.Package]) continue;
          seen[pkg.Package] = true;
          result.push(pkg);
        }

        return result;
      }

      function addTag(parent, value) {
        var el;
        if (!value) return;

        el = document.createElement("span");
        el.className = "tag";
        el.appendChild(document.createTextNode(value));
        parent.appendChild(el);
      }

      function packageIcon(pkg) {
        return "package-icons/" + encodeURIComponent(pkg.Package) + ".png";
      }

      function renderPackage(pkg) {
        var article = document.createElement("article");
        var icon = document.createElement("img");
        var body = document.createElement("div");
        var title = document.createElement("h3");
        var id = document.createElement("div");
        var description = document.createElement("p");
        var meta = document.createElement("div");
        var homepage;
        var link;

        article.className = "package";

        icon.className = "package-icon";
        icon.alt = "";
        icon.src = packageIcon(pkg);
        icon.onerror = function () {
          this.onerror = null;
          this.src = "CydiaIcon.png";
        };

        body.className = "package-body";

        title.appendChild(document.createTextNode(pkg.Name || pkg.Package));

        id.className = "package-id";
        id.appendChild(document.createTextNode(pkg.Package));

        description.appendChild(
          document.createTextNode(pkg.Description || "No description.")
        );

        meta.className = "meta";
        addTag(meta, pkg.Version ? "v" + pkg.Version : "");
        addTag(meta, pkg.Architecture);
        addTag(meta, pkg.Section);

        body.appendChild(title);
        body.appendChild(id);
        body.appendChild(description);

        if (meta.childNodes.length) {
          body.appendChild(meta);
        }

        homepage = pkg.Homepage || pkg.Depiction;
        if (homepage && /^https?:\/\//i.test(homepage)) {
          link = document.createElement("a");
          link.className = "source";
          link.href = homepage;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.appendChild(document.createTextNode("More information →"));
          body.appendChild(link);
        }

        article.appendChild(icon);
        article.appendChild(body);

        return article;
      }

      function showStatus(text) {
        var status;
        packagesNode.innerHTML = "";

        status = document.createElement("div");
        status.className = "status";
        status.appendChild(document.createTextNode(text));
        packagesNode.appendChild(status);
      }

      function renderPackages(packages) {
        var i;
        packagesNode.innerHTML = "";

        if (!packages.length) {
          showStatus("No packages found.");
          return;
        }

        for (i = 0; i < packages.length; i++) {
          packagesNode.appendChild(renderPackage(packages[i]));
        }
      }

      function loadPackages() {
        var xhr = new XMLHttpRequest();

        xhr.open("GET", "Packages?ts=" + new Date().getTime(), true);

        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;

          if (xhr.status >= 200 && xhr.status < 300) {
            renderPackages(parsePackages(xhr.responseText));
          } else {
            showStatus("Could not load the package list.");
          }
        };

        xhr.onerror = function () {
          showStatus("Could not load the package list.");
        };

        xhr.send(null);
      }

      loadPackages();
    })();
  </script>
</body>
</html>
